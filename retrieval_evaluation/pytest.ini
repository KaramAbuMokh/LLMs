[pytest]
# Run from this folder: python -m pytest. The first path makes `retrieval_evaluation` importable, the second the shared contract.
pythonpath = .. ../gpt2_service_huggingface_space
testpaths = tests
addopts = -m "not data" -p no:cacheprovider
markers =
    data: reads the real books and pairs on the Mac (run once with: python -m pytest -m data)
